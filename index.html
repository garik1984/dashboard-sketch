<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15171A">
<title>Кабінет · ескіз v2</title>
<meta http-equiv="Cache-Control" content="no-cache">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Onest:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F3EF; --panel:#FFFFFF; --side:#F7F7F4; --ink:#15171A; --ink2:#33373D; --muted:#4A4F57; --faint:#6B7078; --line:#D6D9D1; --line2:#E4E6E0;
  --accent:#0B6B52; --accent-bg:#E3EDE8; --blue:#2F5BD3; --blue-bg:#E7ECFA; --orange:#C2410C; --orange-bg:#FCE6D6; --orange-ink:#9A3412;
  --top:#15171A; --top-chip:#2A2D31; --top-ink:#C5C9CE; --dot:#C9CCC4;
}
:root[data-theme="dark"]{
  --bg:#111315; --panel:#1A1D20; --side:#16181B; --ink:#ECEDE8; --ink2:#D3D5D0; --muted:#A8ACB2; --faint:#8A8F96; --line:#2C3034; --line2:#24272B;
  --accent:#4FBF95; --accent-bg:#17322A; --blue:#7FA0F0; --blue-bg:#1C2540; --orange:#F08A55; --orange-bg:#3A2418; --orange-ink:#F3A877;
  --top:#0A0B0C; --top-chip:#202327; --top-ink:#A8ACB2; --dot:#2C3034;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111315; --panel:#1A1D20; --side:#16181B; --ink:#ECEDE8; --ink2:#D3D5D0; --muted:#A8ACB2; --faint:#8A8F96; --line:#2C3034; --line2:#24272B;
    --accent:#4FBF95; --accent-bg:#17322A; --blue:#7FA0F0; --blue-bg:#1C2540; --orange:#F08A55; --orange-bg:#3A2418; --orange-ink:#F3A877;
    --top:#0A0B0C; --top-chip:#202327; --top-ink:#A8ACB2; --dot:#2C3034;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Onest',system-ui,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,textarea{font-family:inherit}
button{cursor:pointer}
a{color:var(--accent)}
.mono{font-family:'JetBrains Mono',monospace}
.label{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.app{display:flex;flex-direction:column;height:100dvh;min-height:100vh}

/* ── top bar: projects ── */
.topbar{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--top);color:#F2F3EF;flex:none}
.brand{display:flex;align-items:center;gap:10px;margin-right:8px;flex:none}
.logo{width:28px;height:28px;border-radius:7px;background:#0B6B52;display:grid;place-items:center;flex:none}
.brand span{font-family:'Unbounded',sans-serif;font-weight:700;font-size:15px}
.topbar .label{color:#9FA4AB}
.scroller{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;min-width:0}
.scroller::-webkit-scrollbar{display:none}
.ptab{flex:none;display:flex;align-items:center;gap:8px;height:38px;padding:0 14px 0 8px;border:0;border-radius:9px;background:var(--top-chip);color:var(--top-ink);font-size:14px;white-space:nowrap}
.ptab[aria-current="true"]{background:#F2F3EF;color:#15171A;font-weight:600}
.pdot{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;flex:none}
.addbtn{flex:none;width:38px;height:38px;border-radius:9px;border:1px dashed #4A4F57;background:transparent;color:#C5C9CE;font-size:18px}
.topright{margin-left:auto;display:flex;align-items:center;gap:12px;flex:none}
.conn{font-size:12px;color:#6FCFA7;display:flex;align-items:center;gap:6px}
.conn i{width:8px;height:8px;border-radius:50%;background:#2E9E6B;display:block}
.avatar{width:30px;height:30px;border-radius:50%;background:#F2F3EF;color:#15171A;display:grid;place-items:center;font-size:13px;font-weight:600}
.iconbtn{width:36px;height:36px;border-radius:8px;border:1px solid #33373D;background:transparent;color:#C5C9CE;display:grid;place-items:center}
.pswitch{display:none}

/* ── desktop row 2: project + plugins ── */
.subbar{display:flex;align-items:stretch;background:var(--panel);border-bottom:1px solid var(--line);flex:none}
.projname{flex:0 0 260px;padding:12px 20px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px;justify-content:center}
.projname b{font-family:'Unbounded',sans-serif;font-size:15px;font-weight:500}
.modules{flex:1;display:flex;align-items:center;gap:6px;padding:10px 20px;min-width:0}
.modules .label{margin-right:8px;flex:none}
.mtab{flex:none;display:flex;align-items:center;gap:8px;height:38px;padding:0 16px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--muted);font-size:14px;white-space:nowrap}
.mtab i{width:8px;height:8px;border-radius:2px;display:block}
.mtab[aria-current="true"]{color:var(--ink);font-weight:600}
.mtab.add{border-style:dashed}

/* ── body ── */
.body{flex:1;display:flex;min-height:0}
.side{flex:0 0 260px;background:var(--side);border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:12px;overflow-y:auto}
.side > *{flex-shrink:0}
.shead{display:flex;align-items:center;gap:10px;width:100%;height:46px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:15px;font-weight:600}
.shead[aria-expanded="true"]{border-color:var(--ink)}
.shead.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.shead .cnt{margin-left:auto;font-size:12px;color:var(--faint);font-weight:500}
.shead.on .cnt,.shead.on .dd{color:var(--bg)}
.shead .dd{color:var(--faint);transition:transform .15s}
.shead[aria-expanded="false"] .dd{transform:rotate(-90deg)}
.groups{display:flex;flex-direction:column;gap:2px;max-height:146px;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin}
.grow{flex:none;display:flex;align-items:center;gap:10px;width:100%;min-height:46px;padding:0 10px;border:0;border-radius:8px;background:transparent;color:var(--ink2);font-size:14px;text-align:left}
.grow:hover{background:var(--line2)}
.grow i{width:8px;height:8px;border-radius:2px;display:block;flex:none}
.grow[aria-pressed="true"]{background:var(--panel);box-shadow:inset 0 0 0 1px var(--line);color:var(--ink);font-weight:600}
.grow .n{margin-left:auto;font-size:12px;color:var(--faint);font-weight:500}
.scrollhint{font-size:11px;color:var(--faint);padding:2px 10px 0}
.msearch{margin-top:auto;padding:12px;border-radius:10px;background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.field{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;background:var(--bg)}
.field input{border:0;background:transparent;outline:none;width:100%;font-size:14px;color:var(--ink)}
.mres{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;color:var(--ink2);padding:2px}
.mres button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:5px 10px;font-size:12px;font-weight:600;color:var(--accent);flex:none}
.mres button[disabled]{color:var(--faint);cursor:default}
.empty{font-size:13px;color:var(--faint);padding:8px 10px}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.mainhead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:12px 20px;border-bottom:1px solid var(--line2);background:var(--panel)}
.mainhead h1{margin:0;font-family:'Unbounded',sans-serif;font-size:18px;font-weight:500}
.btn{height:38px;padding:0 14px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:14px}
.btn.dark{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
.canvas{flex:1;overflow:auto;background-color:var(--bg);background-image:radial-gradient(var(--dot) 1px,transparent 1px);background-size:20px 20px;position:relative}
.plane{position:relative;left:56px;top:40px;min-width:1000px;min-height:700px}
.card{position:absolute;width:260px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:8px;box-shadow:0 6px 18px rgba(0,0,0,.08);cursor:grab;user-select:none;touch-action:none;text-align:left;color:var(--ink);font:inherit}
.card.drag{cursor:grabbing;box-shadow:0 14px 32px rgba(0,0,0,.18);z-index:5}
.card h2{margin:0;font-size:15px;font-weight:600;line-height:1.35}
.card p{margin:0;font-size:13px;line-height:1.5;color:var(--muted);white-space:pre-line}
.meta{font-size:11px;color:var(--faint)}
.plug{display:flex;align-items:center;gap:6px}
.plug i{width:8px;height:8px;border-radius:2px;display:block;flex:none}
.badge{align-self:flex-start;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
.b-idea{background:var(--line2);color:var(--muted)}
.b-test{background:var(--blue-bg);color:var(--blue)}
.b-none{background:var(--orange-bg);color:var(--orange-ink)}
.b-note{background:var(--blue-bg);color:var(--blue)}
.b-task{background:var(--accent-bg);color:var(--accent)}
.b-ok{background:var(--accent-bg);color:var(--accent)}

/* corner + (desktop) */
.addwrap{position:sticky;top:0;left:0;height:0;z-index:6}
.addfab{position:absolute;top:14px;left:14px;display:flex;align-items:center;height:44px;min-width:44px;padding:0 11px;border-radius:12px;border:0;background:var(--ink);color:var(--bg);box-shadow:0 8px 20px rgba(0,0,0,.18);font-size:14px;font-weight:600;overflow:hidden;white-space:nowrap}
.addfab .addtip{max-width:0;opacity:0;transition:max-width .2s,opacity .2s,margin .2s}
.addfab:hover .addtip,.addfab:focus-visible .addtip{max-width:240px;opacity:1;margin-left:8px}

/* agent panel */
.agent{position:fixed;right:20px;bottom:20px;width:min(380px,calc(100vw - 32px));background:var(--top);color:#F2F3EF;border-radius:14px;padding:16px;display:none;flex-direction:column;gap:10px;box-shadow:0 20px 50px rgba(0,0,0,.3);z-index:40}
.agent.open{display:flex}
.agent .row{display:flex;align-items:center;justify-content:space-between}
.agent p{margin:0;font-size:14px;line-height:1.5;color:#D3D5D0}
.agent button.x{border:0;background:transparent;color:#C5C9CE;font-size:22px;width:44px;height:44px}

/* ── sheet (bottom sheet on phone, modal on desktop) ── */
.scrim{position:fixed;inset:0;background:rgba(10,11,12,.45);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;top:50%;transform:translate(-50%,-46%);width:min(460px,calc(100vw - 32px));max-height:min(80vh,680px);overflow-y:auto;background:var(--panel);color:var(--ink);border-radius:16px;padding:20px;z-index:51;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;box-shadow:0 30px 80px rgba(0,0,0,.3)}
.sheet.open{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
.sheet .grab{display:none}
.shtop{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.shtop h2{margin:0;font-family:'Unbounded',sans-serif;font-size:17px;font-weight:500;line-height:1.3}
.shx{width:44px;height:44px;flex:none;border:0;border-radius:10px;background:var(--line2);color:var(--ink);font-size:20px}
.shsec{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--muted);font-size:14px}
.opt i{width:8px;height:8px;border-radius:2px;display:block}
.opt[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);font-weight:600;box-shadow:inset 0 0 0 1px var(--ink)}
.inp{width:100%;min-height:48px;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:16px;outline:none;resize:vertical}
.inp:focus{border-color:var(--ink)}
.primary{width:100%;min-height:52px;border:0;border-radius:12px;background:var(--ink);color:var(--bg);font-size:16px;font-weight:600;margin-top:18px}
.ghost{min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--ink);font-size:14px}
.danger{color:var(--orange-ink)}
.rows{display:flex;flex-direction:column;gap:8px}
.rowbtn{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:15px;text-align:left;width:100%}
.rowbtn[aria-current="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);font-weight:600}
.rowbtn .n{margin-left:auto;font-size:13px;color:var(--faint)}

/* links */
.links{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--blue);min-width:0}
.links span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.links svg{flex:none}
.lrow{display:flex;gap:8px;align-items:center}
.lrow .inp{min-height:44px;padding:10px 12px;font-size:16px}
.lrow .inp.bad{border-color:var(--orange);box-shadow:inset 0 0 0 1px var(--orange)}
.lx{width:44px;height:44px;flex:none;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--muted);font-size:18px}
.ladd{align-self:flex-start;min-height:44px;padding:0 14px;border-radius:10px;border:1px dashed var(--line);background:transparent;color:var(--accent);font-size:14px;font-weight:600}
.lopen{display:flex;align-items:center;gap:10px;min-height:48px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:14px;overflow:hidden}
.lopen b{font-weight:600;white-space:nowrap}
.lopen span{color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.lopen svg{flex:none;color:var(--blue)}
/* chat + notion */
.svcs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.svc{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 12px;border-radius:12px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);font-size:15px;font-weight:600;text-decoration:none}
.svc.empty{background:transparent;color:var(--muted);border:1px dashed var(--line);font-weight:500}
.svc svg{flex:none}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--line2);color:var(--ink2)}
.pill svg{flex:none}
.flabel{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin:10px 0 6px}
/* mobile-only blocks hidden on desktop */
.mfilters,.mbar,.mlist{display:none}
.ver{position:fixed;right:12px;bottom:10px;font-size:11px;color:var(--faint);pointer-events:none}

/* ════════ PHONE ════════ */
@media (max-width: 860px){
  .topbar{padding:8px 12px;gap:8px;padding-top:calc(8px + env(safe-area-inset-top))}
  .brand span,.plabel,#projects,.conn span{display:none}
  .brand{margin:0}
  .pswitch{display:flex;align-items:center;gap:10px;flex:1;min-width:0;height:44px;padding:0 10px 0 6px;border:0;border-radius:10px;background:var(--top-chip);color:#F2F3EF;font-size:15px;font-weight:600;text-align:left}
  .pswitch .pname{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pswitch svg{flex:none;color:var(--top-ink)}
  .topright{gap:8px;margin-left:0}
  .iconbtn{width:44px;height:44px;border-radius:10px}
  .avatar{display:none}
  .subbar,.side,.mainhead,.addwrap,.ver{display:none}

  .mfilters{display:flex;flex-direction:column;gap:10px;padding:10px 0 10px;background:var(--panel);border-bottom:1px solid var(--line);flex:none}
  .seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;margin:0 12px;padding:4px;border-radius:12px;background:var(--line2)}
  .seg button{min-height:40px;padding:0 4px;white-space:nowrap;border:0;border-radius:9px;background:transparent;color:var(--muted);font-size:15px;font-weight:500}
  .seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .seg .n{font-size:12px;color:var(--faint);margin-left:4px}
  .mchips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:0 12px;scroll-padding:12px}
  .mchips::-webkit-scrollbar{display:none}
  .chip{flex:none;display:flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--muted);font-size:14px;white-space:nowrap}
  .chip i{width:8px;height:8px;border-radius:2px;display:block}
  .chip[aria-pressed="true"]{color:var(--ink);font-weight:600}
  .chip .n{font-size:12px;color:var(--faint);font-weight:500}
  .chip.add{border-style:dashed;padding:0 12px}

  .canvas{background-image:none;-webkit-overflow-scrolling:touch}
  .plane{display:none}
  .mlist{display:flex;flex-direction:column;gap:10px;padding:12px 12px calc(110px + env(safe-area-inset-bottom))}
  .grp{display:flex;align-items:center;gap:8px;margin:10px 4px 0;font-size:13px;font-weight:600;color:var(--muted)}
  .grp:first-child{margin-top:0}
  .grp .n{font-weight:500;color:var(--faint)}
  .grp i{width:8px;height:8px;border-radius:50%;display:block}
  .mcard{position:static;width:100%;cursor:pointer;box-shadow:none;touch-action:auto;user-select:auto;padding:14px 14px 12px;gap:6px}
  .mcard:active{transform:scale(.99);background:var(--side)}
  .mcard .foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:2px}
  .mcard p{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .hint{font-size:13px;color:var(--faint);text-align:center;padding:4px 0 0}

  .mbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;position:fixed;left:0;right:0;bottom:0;z-index:30;padding:0 16px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 60%,transparent);pointer-events:none}
  .mbar > *{pointer-events:auto}
  .mside{justify-self:start;display:flex;align-items:center;gap:8px;height:48px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:14px;font-weight:600;box-shadow:0 6px 16px rgba(0,0,0,.08)}
  .mside.r{justify-self:end}
  .mplus{width:64px;height:64px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);display:grid;place-items:center;box-shadow:0 10px 24px rgba(0,0,0,.25);margin:0 8px}
  .agent{left:12px;right:12px;width:auto;bottom:calc(84px + env(safe-area-inset-bottom))}

  .sheet{left:0;right:0;top:auto;bottom:0;width:100%;max-height:88dvh;transform:translateY(100%);border-radius:20px 20px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom))}
  .sheet.open{transform:translateY(0)}
  .sheet .grab{display:block;width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
}
</style>
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="brand">
      <div class="logo"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><path d="M14 17.5h7M17.5 14v7"/></svg></div>
      <span>[НАЗВА]</span>
    </div>
    <span class="label plabel">Проєкти</span>
    <nav class="scroller" id="projects" aria-label="Проєкти"></nav>
    <button class="pswitch" id="pswitch" aria-label="Обрати проєкт"><span class="pdot" id="pswDot"></span><span class="pname" id="pswName"></span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
    <div class="topright">

  function drag(a, e, kx, ky, v){
    var c = e.c, sx, sy, ox, oy, on = false, moved = false;
    a.addEventListener('pointerdown', function(ev){
      on = true; moved = false; sx = ev.clientX; sy = ev.clientY; ox = c[kx]; oy = c[ky]; a.setPointerCapture(ev.pointerId);
    });

      var dx = ev.clientX - sx, dy = ev.clientY - sy;
      if (!moved && Math.abs(dx) + Math.abs(dy) < 5) return;
      moved = true; a.classList.add('drag');
      c[kx] = Math.max(0, ox + dx); c[ky] = Math.max(0, oy + dy); a.style.left = c[kx]+'px'; a.style.top = c[ky]+'px';
    });
    a.addEventListener('pointerup', function(){
      if (!on) return; on = false; a.classList.remove('drag');
      if (moved) save(); else openCard(v.kind, e);
    });
  }

  var toastT;
  function toast(msg){
    var t = $('toast'); if (!t){ t = el('div', {'id':'toast','role':'status','style':'position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;font-size:14px;z-index:60;max-width:calc(100vw - 32px);box-shadow:0 10px 30px rgba(0,0,0,.25)'}); document.body.appendChild(t); }
    t.textContent = msg; t.style.display = 'block'; clearTimeout(toastT); toastT = setTimeout(function(){ t.style.display = 'none'; }, 2200);
  }

  function openAgent(text, about){
    var v = V();
    $('amod').textContent = about ? '«' + about + '»' : (v.m === 'all' ? 'усі плагіни' : M[v.m].name);
    $('atext').textContent = text || AGENT[v.m] || AGENT.all;
    $('agent').classList.add('open');
  }

  function headClick(kind, openKey){
    var v = V();
    if (v.kind === kind && v.m === 'all' && st[openKey] !== false) st[openKey] = false;
    else { st[openKey] = true; st.view = {kind:kind, m:'all'}; }
    save(); render();
  }
  $('hIdeas').onclick = function(){ headClick('ideas', 'openIdeas'); };
  $('hNotes').onclick = function(){ headClick('notes', 'openNotes'); };
  $('hTasks').onclick = function(){ headClick('tasks', 'openTasks'); };
  $('segIdeas').onclick = function(){ setView('ideas', V().m); };
  $('segNotes').onclick = function(){ setView('notes', V().m); };
  $('segTasks').onclick = function(){ setView('tasks', V().m); };
  $('q').oninput = function(){ renderSearch($('q').value, $('mres')); };
  $('addmod').onclick = function(){ $('q').focus(); };
  $('addcard').onclick = openAdd; $('mplus').onclick = openAdd;
  $('pswitch').onclick = openProjects;
  $('mplugins').onclick = openPlugins;
  $('viewreset').onclick = function(){ setView('ideas', 'all'); };
  $('askd').onclick = function(){ openAgent(); }; $('magent').onclick = function(){ openAgent(); };
  $('aclose').onclick = function(){ $('agent').classList.remove('open'); };
  $('theme').onclick = function(){
    var r = document.documentElement, cur = r.getAttribute('data-theme');
    var dark = cur ? cur === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
    r.setAttribute('data-theme', dark ? 'light' : 'dark');
    try { localStorage.setItem('sketch-theme', dark ? 'light' : 'dark'); } catch(e){}
  };
  try { var th = localStorage.getItem('sketch-theme'); if (th) document.documentElement.setAttribute('data-theme', th); } catch(e){}
  if (mq.addEventListener) mq.addEventListener('change', render); else mq.addListener(render);
  render();
})();
</script>
</body>
</html>
